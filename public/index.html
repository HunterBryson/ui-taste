<!doctype html>
<!-- UI Taste: one design, big, and the parts of it you and your AI have talked about. Box a part, your AI says back what it sees,
     you answer Yes or Not quite. Everything you tap saves at once and reaches your AI when you press ➤ Send. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Taste</title>
<link rel="icon" id="icon" href="data:,">
<style>
  :root { --bg:#0c0d10; --tile:#16181d; --line:#272a32; --ink:#ecebe8; --soft:#b4b7be; --dim:#7f828a;
    --him:#6cc6ff; --him-body:#0f1f2b; --odie:#f5a524; --odie-body:#231a09; --odie-ink:#1a1206; --ok:#63d391; --no:#ff8a80; --no-body:#2a1211;
    /* the AI's floating card (the glass) sits at the top right of the screen: keep that corner of the top bar clear */
    --card: clamp(32px, calc(100vw - 1240px), 520px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 132px 1fr; height: 100vh; }

  /* the header: the name, what the AI is asking, what it has learned by kind, and Send */
  .top { grid-column: 1 / -1; position: relative; display: flex; align-items: center; gap: 24px; padding: 0 var(--card) 0 28px;
    background: radial-gradient(900px 140px at 18% 0%, rgba(108,198,255,.10), transparent 70%), radial-gradient(700px 140px at 62% 0%, rgba(245,165,36,.07), transparent 70%), #0e1015; }
  .top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, rgba(108,198,255,0) 0%, rgba(108,198,255,.7) 22%, rgba(108,198,255,.25) 45%, rgba(245,165,36,.25) 60%, rgba(245,165,36,.75) 85%, rgba(245,165,36,0) 100%); }
  .brand { display: flex; align-items: center; gap: 16px; flex: none; }
  .mark { width: 54px; height: 54px; flex: none; }
  .brand .words { display: flex; flex-direction: column; }
  .home { align-self: flex-start; color: var(--soft); text-decoration: none; font-size: 15px; font-weight: 600; line-height: 1; margin-bottom: 8px; padding: 7px 14px; border-radius: 15px; border: 1px solid #3a3e48; }
  .home:hover { color: var(--ink); border-color: var(--soft); }
  .home[hidden] { display: none; }
  h1 { margin: 0; font-size: 36px; font-weight: 700; line-height: 1.05; letter-spacing: -.5px; white-space: nowrap; }
  .tag { margin-top: 6px; color: var(--soft); font-size: 16px; white-space: nowrap; }
  .rule { width: 1px; align-self: stretch; margin: 26px 0; background: linear-gradient(transparent, #343843, transparent); flex: none; }

  i.ai, i.me { display: grid; place-items: center; border-radius: 50%; font-style: normal; font-weight: 700; flex: none; }
  i.ai { background: var(--odie); color: var(--odie-ink); }
  i.me { background: var(--him); color: #06202e; }
  i.me svg { width: 60%; height: 60%; }

  .map { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .map .lab { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--odie); white-space: nowrap; min-width: 0; }
  .map .lab img, .map .lab i { width: 22px; height: 22px; border-radius: 50%; font-size: 12px; }
  .map .lab .t { overflow: hidden; text-overflow: ellipsis; }
  .map .lab #learnedN { color: var(--soft); font-weight: 600; }
  /* the kinds learned so far: only the ones with something in them; they wrap rather than run under the corner */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; min-width: 0; }
  .kt { height: 34px; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-radius: 10px;
    border: 2px solid #6b5a33; background: linear-gradient(180deg, #2a1f0b, #1b1508); color: var(--ink); overflow: hidden; line-height: 1; }
  .kt .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kt .ct { font-size: 17px; font-weight: 700; color: var(--odie); }
  .kt:hover { filter: brightness(1.2); }
  .kt.on { border-color: var(--him); background: var(--him-body); box-shadow: 0 0 0 3px rgba(108,198,255,.25); }
  .kt.on .ct { color: var(--him); }
  .first { margin: 0; color: var(--ink); font-size: 17px; line-height: 1.35; }
  .first b { color: var(--him); }

  /* the first thing: what the AI is waiting on them for */
  .need { flex: none; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 8px; border-radius: 31px; border: 2px solid #2a2e37; background: #12151b; color: var(--dim); font-size: 16px; font-weight: 600; white-space: nowrap; cursor: default; }
  .need img, .need i { width: 44px; height: 44px; border-radius: 50%; opacity: .45; font-size: 20px; }
  .need.on { border-color: var(--odie); background: var(--odie); color: var(--odie-ink); font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 26px rgba(245,165,36,.3); }
  .need.on img, .need.on i { opacity: 1; }
  .need.on i { background: var(--odie-ink); color: var(--odie); }
  .need.on:hover { filter: brightness(1.08); }

  .send { flex: none; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-width: 210px; height: 62px; padding: 0 22px; border-radius: 31px;
    border: 2px solid #2f333c; background: #1a1d23; color: var(--dim); cursor: default; }
  .send .a { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .send .b { font-size: 14px; font-weight: 600; opacity: .85; white-space: nowrap; }
  .send.on { border-color: var(--him); background: var(--him); color: #06202e; cursor: pointer; box-shadow: 0 6px 26px rgba(108,198,255,.35); }
  .send.on:hover { filter: brightness(1.08); }

  /* the filmstrip: add one, then every design, by name */
  .strip { overflow-y: auto; padding: 14px 16px 24px 24px; scrollbar-width: thin; scrollbar-color: #2c2f38 transparent; }
  .add { display: block; width: 100%; height: 52px; margin-bottom: 6px; border-radius: 12px; border: 2px dashed #4a4e59; background: none; color: var(--ink); font-size: 16px; font-weight: 600; white-space: nowrap; }
  .add:hover { border-color: var(--ink); }
  .add small { display: block; margin-top: -2px; color: var(--dim); font-size: 12px; font-weight: 600; }
  .strip h2 { margin: 16px 0 10px; font-size: 15px; font-weight: 600; color: var(--soft); display: flex; justify-content: space-between; }
  .th { display: block; width: 100%; padding: 0; margin: 0 0 12px; border: 2px solid transparent; border-radius: 10px; background: var(--tile); overflow: hidden; text-align: left; position: relative; }
  .th img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left; opacity: .8; background: #08090b; }
  .th span { display: block; padding: 7px 10px 9px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th:hover img { opacity: 1; }
  .th.on { border-color: var(--him); }
  .th.on img { opacity: 1; }
  .th.dim { opacity: .3; }
  .th .odtag { position: absolute; bottom: 40px; left: 8px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(12,13,16,.85); color: var(--odie); font-size: 12px; font-weight: 700; line-height: 22px; }
  .th .odtag.want { color: var(--him); }
  .th .rmx { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 14px; background: rgba(12,13,16,.9); color: var(--soft); font-style: normal; font-size: 14px; line-height: 28px; text-align: center; visibility: hidden; }
  .th:hover .rmx { visibility: visible; } .th .rmx:hover { color: var(--ink); background: #3a1a18; }
  .th .asks { position: absolute; top: 8px; right: 40px; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--odie); color: var(--odie-ink); font-size: 14px; font-weight: 700; line-height: 26px; text-align: center; }
  .th .pts { position: absolute; top: 8px; left: 8px; height: 24px; padding: 0 9px; border-radius: 12px; background: rgba(12,13,16,.82); color: var(--him); font-size: 13px; font-weight: 700; line-height: 24px; }

  /* the stage: one design, big, and what you've both said about its parts */
  .stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
  .head { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 12px 32px 0 16px; min-width: 0; }
  .head h2 { margin: 0; font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .meta { color: var(--soft); font-size: 16px; white-space: nowrap; }
  .head a.meta { color: var(--him); text-decoration: none; } .head a.meta:hover { text-decoration: underline; }
  .head .back { margin-left: auto; height: 48px; padding: 0 22px; border-radius: 24px; border: 2px solid var(--him); background: var(--him-body); color: var(--ink); font-size: 17px; font-weight: 700; white-space: nowrap; }
  .head .back:hover { filter: brightness(1.2); }
  .head .link { border: 0; background: none; color: var(--soft); font-size: 14px; text-decoration: underline; padding: 0; white-space: nowrap; }
  .ours { padding: 3px 12px; border-radius: 13px; font-size: 14px; font-weight: 700; border: 1px solid; white-space: nowrap; }
  .ours.love { color: var(--ok); border-color: #2f6b49; } .ours.no { color: var(--no); border-color: #7a3a35; }
  .wantTag { padding: 3px 12px; border-radius: 13px; font-size: 14px; font-weight: 700; border: 1px solid #2f6e95; color: var(--him); white-space: nowrap; }
  /* a design saved from the glass asks once: a taste, or something to build? */
  .once { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border-radius: 26px; border: 2px solid var(--him); background: var(--him-body); min-width: 0; }
  .once span { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .once button { height: 40px; padding: 0 18px; border-radius: 20px; font-size: 15px; font-weight: 700; white-space: nowrap; border: 0; }
  .once .like { background: var(--him); color: #06202e; } .once .build { background: var(--odie); color: var(--odie-ink); }
  .once button:hover { filter: brightness(1.1); }

  .look { position: relative; min-height: 0; overflow: hidden; }
  .pic { position: absolute; border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.55); cursor: crosshair; user-select: none; -webkit-user-drag: none; }
  .box { position: absolute; border: 3px solid var(--him); border-radius: 8px; pointer-events: auto; cursor: pointer; }
  .box.ai { border-color: var(--odie); }
  .box.dim { opacity: .45; }
  .box.draw { pointer-events: none; background: rgba(108,198,255,.08); }
  .box.no { border-color: var(--no); }
  .look.drawing .bal, .look.drawing svg.tails { opacity: .12; pointer-events: none; }
  svg.tails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }

  /* a balloon never runs off the stage: placed inside it, and it scrolls itself if it grows taller than the room */
  .bal { position: absolute; z-index: 3; width: clamp(240px, 19vw, 300px); max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow-y: auto; scrollbar-width: thin;
    border-radius: 14px; border: 3px solid var(--him); background: var(--him-body); padding: 10px 14px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .bal.ai { border-color: var(--odie); background: var(--odie-body); }
  .bal.ok { border-color: var(--ok); }
  .bal .who { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 4px; color: var(--him); }
  .bal.ai .who { color: var(--odie); }
  .bal .who img, .bal .who i { width: 26px; height: 26px; border-radius: 50%; flex: none; font-size: 14px; }
  .bal .who .tag { margin-left: auto; font-weight: 600; font-size: 13px; color: var(--soft); }
  .bal .who .tag.ok { color: var(--ok); }
  .bal .x { margin-left: 6px; border: 0; background: none; color: var(--dim); font-size: 16px; padding: 0 2px; visibility: hidden; }
  .bal:hover .x { visibility: visible; }
  .bal .x:hover { color: var(--ink); }
  .bal p { margin: 0; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
  .bal p.quiet { color: var(--soft); font-style: italic; }
  .bal .mine { margin: 10px -14px -12px; padding: 10px 14px 12px; border-top: 3px solid var(--odie); background: var(--odie-body); border-radius: 0 0 11px 11px; }
  .bal .mine .who { color: var(--odie); }
  .bal.ok .mine { border-top-color: var(--ok); }
  .bal .said { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(108,198,255,.3); color: var(--him); font-size: 16px; }
  .bal .draft { margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--him); }
  .bal .undo { border: 0; background: none; padding: 0; margin-left: 6px; color: var(--soft); font-size: 13px; text-decoration: underline; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acts button { flex: 1; height: 46px; padding: 0 10px; border-radius: 23px; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .bal.waits { z-index: 4; }
  .bal.compact { width: 230px; cursor: pointer; }
  .bal.compact p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bal.ask-on { box-shadow: 0 0 0 4px rgba(245,165,36,.35), 0 10px 30px rgba(0,0,0,.5); }
  .yes { border: 0; background: var(--ok); color: #06210f; }
  .yes:hover { filter: brightness(1.1); }
  .nq { border: 2px solid #6b5a33; background: none; color: var(--ink); }
  .nq:hover { border-color: var(--odie); }
  .bal.no { border-color: var(--no); background: var(--no-body); } .bal.no > .who { color: var(--no); }
  .bal.no > .who i.me { background: var(--no); color: #2a0b08; }
  .lk { display: flex; gap: 8px; margin: 6px 0 4px; }
  .lk button { flex: 1; height: 38px; border-radius: 19px; border: 2px solid #2f4a5e; background: none; font-weight: 700; font-size: 15px; color: var(--soft); }
  .lk button.on { background: var(--him); border-color: var(--him); color: #06202e; }
  .lk button.not.on { background: var(--no); border-color: var(--no); color: #2a0b08; }
  .bal textarea { display: block; width: 100%; min-height: 64px; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid #2f4a5e; background: #0a141c; resize: none; font-size: 17px; line-height: 1.4; outline: none; }
  .bal textarea:focus { border-color: var(--him); }
  .bal .hint { margin-top: 6px; font-size: 13px; color: var(--dim); }
  @keyframes arrive { 0% { box-shadow: 0 0 0 0 rgba(245,165,36,.85); } 100% { box-shadow: 0 0 0 20px rgba(245,165,36,0); } }
  .bal.new { animation: arrive 1.1s ease-out 3; }

  /* a kind, in place: every part of that kind */
  .board { position: absolute; inset: 0; overflow-y: auto; padding: 10px 32px 28px 16px; scrollbar-width: thin; scrollbar-color: #2c2f38 transparent; }
  .shelf { display: flex; flex-wrap: wrap; gap: 20px; }
  .part { width: 420px; max-width: 100%; border: 2px solid var(--line); padding: 0; background: var(--tile); border-radius: 12px; overflow: hidden; text-align: left; cursor: pointer; }
  .part:hover { outline: 2px solid var(--him); }
  .part.not { border-color: #7a3a35; }
  .part .crop { height: 230px; background: #08090b center / contain no-repeat; }
  .part .w { padding: 10px 14px 12px; }
  .part .w p { margin: 0 0 4px; font-size: 16px; }
  .part .w .h { color: var(--him); } .part .w .o { color: var(--odie); } .part .w .n { color: var(--no); font-weight: 700; }
  .part .w .c { color: var(--soft); font-size: 14px; }
  .part .w small { display: block; margin-top: 6px; color: var(--him); font-size: 14px; font-weight: 600; }
  .board .none { margin-top: 18vh; text-align: center; color: var(--soft); font-size: 19px; }
  .board .none b { display: block; color: var(--ink); font-size: 26px; margin-bottom: 10px; }

  /* nothing yet: the whole stage is the place to paste or drop */
  .empty { position: absolute; inset: 18px 32px 18px 16px; display: grid; place-items: center; text-align: center; color: var(--soft); font-size: 19px;
    border: 3px dashed #34404c; border-radius: 22px; background: radial-gradient(600px 300px at 50% 45%, rgba(108,198,255,.06), transparent 70%); cursor: pointer; }
  .empty:hover { border-color: var(--him); }
  .empty b { display: block; color: var(--ink); font-size: 30px; margin-bottom: 12px; }
  .empty .keys { display: table; margin: 18px auto 0; padding: 10px 20px; border-radius: 22px; background: var(--him); color: #06202e; font-weight: 700; font-size: 17px; }
  .empty .or { display: block; margin-top: 14px; font-size: 16px; color: var(--dim); }
  .teach { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; padding: 8px 18px; border-radius: 20px; background: rgba(15,31,43,.92); border: 1px solid #2f4a5e; color: var(--him); font-size: 15px; white-space: nowrap; pointer-events: none; z-index: 2; }

  /* under the picture: their words on the whole design, and what the AI learned from it */
  .foot:empty { display: none; }
  .foot { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 80px; padding: 10px 32px 14px 16px; align-items: stretch; }
  .say { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--tile); min-width: 0; text-align: left; }
  .say .body { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; }
  .say .body p { margin: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .say input { width: 100%; border: 0; background: none; outline: none; padding: 0; font-size: 17px; color: var(--ink); }
  .say input::placeholder { color: var(--dim); }
  .say.sum { cursor: pointer; } .say.sum:hover, .say.sum.open { border-color: var(--odie); }
  .say .chev { margin-left: auto; flex: none; color: var(--odie); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .say.him { border-color: #24506b; background: var(--him-body); }
  .say.ai { border-color: #6b5a33; background: var(--odie-body); }
  .say img, .say i { width: 40px; height: 40px; border-radius: 50%; flex: none; font-size: 18px; }
  .say .lab { font-size: 14px; font-weight: 700; color: var(--him); }
  .say.ai .lab { color: var(--odie); }
  .more { position: absolute; z-index: 8; right: 32px; bottom: calc(100% - 6px); width: calc(50% - 24px); max-height: 62vh; overflow-y: auto; padding: 18px 20px; border-radius: 16px; border: 2px solid var(--odie); background: #1c1508; box-shadow: 0 -10px 40px rgba(0,0,0,.6); }
  .more h3 { margin: 0 0 10px; font-size: 20px; }
  .more .take { margin: 0 0 14px; font-size: 17px; color: var(--ink); }
  .more .lp { display: flex; gap: 14px; margin: 0 0 12px; padding: 10px; border-radius: 12px; background: #120e06; }
  .more .lp.not { outline: 2px solid #7a3a35; }
  .more .lp .crop { width: 150px; height: 90px; flex: none; border-radius: 8px; background: #08090b center / contain no-repeat; }
  .more .lp p { margin: 0 0 4px; font-size: 16px; } .more .h { color: var(--him); } .more .o { color: var(--odie); } .more .n { color: var(--no); } .more .c { color: var(--soft); font-size: 14px; }
  .more .quiet { color: var(--soft); }
  .used { display: inline-block; margin: 6px 8px 0 0; padding: 2px 12px; border-radius: 12px; border: 1px solid #6b5a33; color: var(--odie); font-size: 14px; font-weight: 600; }

  .drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(12,13,16,.9); border: 3px dashed var(--him); font-size: 28px; z-index: 30; }
  body.dragging .drop { display: grid; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 12px 22px; border-radius: 24px; background: #20232a; border: 1px solid var(--line); font-size: 16px; display: none; z-index: 40; }

  /* a laptop screen: smaller tiles, so six kinds still fit in two rows */
  @media (max-width: 1600px) and (min-width: 901px) {
    .top { gap: 18px; } .tag { display: none; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
    .kt { height: 30px; padding: 0 9px; } .kt .nm { font-size: 14px; } .kt .ct { font-size: 15px; }
    .need { padding-right: 16px; font-size: 15px; } .need.on { font-size: 16px; }
    .send { min-width: 180px; }
  }

  /* a phone: the same things, stacked, and the parts as a list under the picture */
  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; }
    .app { display: block; height: auto; }
    .top { flex-wrap: wrap; gap: 10px 16px; padding: 14px 16px; }
    .home, .rule, .mark, .tag { display: none; }
    .map { flex-basis: 100%; order: 3; }
    .send { height: 48px; min-width: 0; }
    .strip { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 10px; }
    .strip h2 { display: none; }
    .add { flex: none; width: 150px; height: auto; margin: 0; }
    .th { flex: none; width: 150px; margin: 0; }
    .head { flex-wrap: wrap; }
    .once { margin-left: 0; flex-wrap: wrap; }
    .look { overflow: visible; padding: 0 16px; min-height: 240px; }
    .pic { position: static; max-width: 100%; height: auto !important; }
    .box, svg.tails, .teach { display: none; }
    .bal { position: static; width: auto; max-height: none; margin: 12px 0 0; }
    .foot { grid-template-columns: 1fr; height: auto; padding: 12px 16px 24px; }
    .more { left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 54 54" aria-hidden="true">
        <path d="M27 6 48 17 27 28 6 17Z" fill="none" stroke="#6cc6ff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M6 27 27 38 48 27" fill="none" stroke="#6cc6ff" stroke-opacity=".7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M6 37 27 48 48 37" fill="none" stroke="#f5a524" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="words">
        <a class="home" id="home" href="#" hidden>← Homebase</a>
        <h1>UI Taste</h1>
        <div class="tag">Box what you like. <span class="ai-name">Claude</span> learns it.</div>
      </div>
    </div>
    <div class="rule"></div>
    <button class="need" id="need"></button>
    <div class="rule"></div>
    <div class="map">
      <div class="lab"><span id="labFace"></span><span class="t">What <span class="ai-name">Claude</span> has learned so far <span id="learnedN"></span></span></div>
      <div id="tiles"></div>
    </div>
    <button class="send" id="send"><span class="a">➤ Send to <span class="ai-name">Claude</span></span><span class="b" id="sendN">Nothing to send yet</span></button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="stage">
    <div class="head" id="head"></div>
    <div class="look" id="look"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<div class="drop">Drop it. It goes straight into your taste.</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Who's who, from ui-taste.config.json (/api/config): the AI's name and face, the person's first letter.
let AI = 'Claude', FACE = '<i class="ai">C</i>', ME = '';
const isAI = p => p.by === 'ai' || p.by === 'odie', isMe = p => p.by === 'person' || p.by === 'hunter';
const FIGURE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>';
const meIcon = () => `<i class="me">${ME || FIGURE}</i>`;
async function who() {
  let c = {};
  try {
    c = await fetch('/api/config').then(r => r.json());
    AI = (c.ai?.name || 'Claude').trim() || 'Claude';
    FACE = c.ai?.picture ? '<img src="/api/picture" alt="">' : `<i class="ai">${esc(AI.slice(0, 1).toUpperCase())}</i>`;
    const n = (c.person?.name || '').trim(); ME = n ? esc(n.slice(0, 1).toUpperCase()) : '';
  } catch {}
  document.querySelectorAll('.ai-name').forEach(x => x.textContent = AI);
  $('labFace').innerHTML = FACE;
  $('icon').href = c.ai?.picture ? '/api/picture' : 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54"><path d="M27 6 48 17 27 28 6 17Z" fill="none" stroke="#6cc6ff" stroke-width="4" stroke-linejoin="round"/><path d="M6 37 27 48 48 37" fill="none" stroke="#f5a524" stroke-width="4" stroke-linejoin="round"/></svg>');
  // A way back: the Homebase address in the config, or the page that opened this one.
  const home = $('home');
  if (c.homebase) { home.href = c.homebase; home.textContent = '← Homebase'; home.hidden = false; }
  else { try { if (document.referrer && new URL(document.referrer).origin !== location.origin) { home.href = document.referrer; home.textContent = '← Back'; home.hidden = false; } } catch {} }
}
const narrow = () => innerWidth <= 900;
let all = [], cur = null, active = null, draft = null, fixing = null, editing = null, learned = [], typed = {};   // typed: their half-written words, kept through any redraw
let mode = null;          // a kind ('navigation'…) shows the board of that kind in place of the design; null shows the design
let seen = null;          // the AI's reads already on screen, so a new one glows when it lands
let moreOpen = false;     // the summary of what the AI learned from this design, open over the picture
const openReads = () => all.flatMap(it => (it.points || []).filter(p => p.read && !p.verdict).map(p => ({ it, p }))).sort((a, b) => a.p.read.at.localeCompare(b.p.read.at));
const toast = (s, ms = 2400) => { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); };
const name = it => it.title || it.from?.title || (it.from?.how === 'glass' && it.from?.app) || 'Untitled';
const img = it => `/api/taste/${it.id}/image`;
const mine = () => all.filter(x => x.status !== 'inbox'), brought = () => all.filter(x => x.status === 'inbox').sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
const asks = it => (it.points || []).filter(p => p.read && !p.verdict).length;       // the AI's reads waiting on their Yes / Not quite
const item = () => all.find(x => x.id === cur);
const api = (path, method, body) => fetch('/api/taste' + path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
const typing = () => !!(draft || fixing || editing) || ['TEXTAREA', 'INPUT'].includes(document.activeElement?.tagName);
let lastSig = '';         // what the page last drew from; a refresh that changes nothing redraws nothing

async function load(first) {
  const [a, l] = await Promise.all([fetch('/api/taste').then(r => r.json()), fetch('/api/taste/learned').then(r => r.json())]);
  all = a.items || []; learned = l.learned || [];
  const sig = JSON.stringify([all.map(x => [x.id, x.status, x.note, x.take, x.title, x.ask, x.want?.sent, (x.used || []).length, (x.points || []).map(p => [p.id, p.his, p.read?.text, p.verdict?.ok, p.verdict?.sent, p.verdict?.words, p.sent, p.dislike, p.kind, p.crop, JSON.stringify(p.box)])]), learned.length]);
  if (!first && sig === lastSig) return;
  lastSig = sig;
  if (!seen) seen = new Set(all.flatMap(it => (it.points || []).filter(p => p.read).map(p => p.id + p.read.at)));
  if (!item()) {
    let want = null; try { want = new URLSearchParams(location.search).get('open') || localStorage.getItem('taste-open'); } catch {}
    const order = [...mine(), ...brought()];
    cur = (order.find(x => x.id === want) || order.find(asks) || order[0])?.id || null;
  }
  drawStrip(); drawTop(); crops();
  if (mode) { if (!typing()) drawStage(); }
  else if (first || !item() || !document.querySelector('.pic')) drawStage();
  else if (!typing()) { drawHead(); drawParts(); if (document.activeElement?.id !== 'note') drawFoot(); }
}

// One rule for Send: every answer they gave (a box, a Yes, a Not quite, "want built") waits for it, and the count is all of them.
const unsent = () => { let n = 0; for (const it of all) { if (it.want && it.want.sent === false) n++; for (const p of it.points || []) if ((isMe(p) && !p.read && p.sent === false) || (p.verdict && p.verdict.sent === false)) n++; } return n; };
const KINDS = [['layout', 'Layout'], ['feel', 'Feel'], ['colors', 'Colors'], ['buttons', 'Buttons'], ['navigation', 'Navigation'], ['type', 'Type']];
function drawTop() {
  // The kinds appear as they get learned. With nothing learned yet, one plain line says what to do first.
  const t = $('tiles'); t.innerHTML = ''; t.className = 'tiles';
  const got = KINDS.map(([k, label]) => [k, label, learned.filter(p => p.kind === k).length]).filter(x => x[2]);
  if (!got.length) {
    t.className = '';
    const anyParts = all.some(it => (it.points || []).length);
    t.innerHTML = !all.length ? `<p class="first"><b>Start here:</b> paste a design you like (Ctrl+V), then box the part you mean.</p>`
      : !anyParts ? `<p class="first"><b>Next:</b> drag a box around a part you like, say a word or two, then press ➤ Send.</p>`
      : learned.length ? `<p class="first">${learned.length} part${learned.length === 1 ? '' : 's'} so far, not sorted into a kind yet. ${esc(AI)} sorts them as it reads them.</p>`
      : `<p class="first">Nothing learned yet. Press ➤ Send when you're ready, and answer ${esc(AI)}'s questions with Yes or Not quite.</p>`;
  }
  for (const [k, label, n] of got) {
    const b = document.createElement('button'); b.className = 'kt' + (mode === k ? ' on' : '');
    b.title = mode === k ? 'Click again to go back to the design' : `See all ${n} ${label.toLowerCase()} part${n === 1 ? '' : 's'} ${AI} has learned, right here`;
    b.innerHTML = `<span class="nm">${label}</span><span class="ct">${n}</span>`;
    b.onclick = () => setMode(mode === k ? null : k);
    t.append(b);
  }
  const open1 = openReads(), need = $('need');
  need.classList.toggle('on', open1.length > 0);
  need.innerHTML = `${FACE}<span>${open1.length ? `${esc(AI)} is asking you · ${open1.length}` : 'Nothing waiting on you'}</span>`;
  need.title = open1.length ? `Go straight to what ${AI} is asking you, on "${name(open1[0].it)}"` : `When ${AI} asks you something about a design, it shows up here`;
  need.onclick = () => { const o = openReads()[0]; if (o) open(o.it.id, o.p.id); };
  const u = unsent(); $('send').classList.toggle('on', u > 0);
  $('send').querySelector('.a').innerHTML = `➤ Send to ${esc(AI)}${u ? ` · ${u}` : ''}`;
  $('sendN').textContent = u ? `Saved. This tells ${AI}.` : 'Nothing to send yet';
  $('send').title = u ? `Everything you did is already saved. This tells ${AI} (Alt+Q).` : `Box a part, or answer one of ${AI}'s questions, then send it here.`;
  const n = learned.length;
  $('learnedN').textContent = n ? `· ${n} part${n === 1 ? '' : 's'}` : '';
}

function drawStrip() {
  const s = $('strip'), y = s.scrollTop; s.innerHTML = '';
  const add = document.createElement('button'); add.className = 'add'; add.innerHTML = '+ Add a design<small>or paste it (Ctrl+V)</small>';
  add.onclick = () => $('pick').click(); s.append(add);
  const list = [...mine(), ...brought()];
  if (!list.length) return;
  const h = document.createElement('h2'); h.innerHTML = `<span>Designs</span><span>${list.length}</span>`; s.append(h);
  for (const it of list) {
    const fits = !mode || (it.points || []).some(p => p.kind === mode);
    const b = document.createElement('button'); b.className = 'th' + (it.id === cur && !mode ? ' on' : '') + (fits ? '' : ' dim'); b.title = name(it);
    const n = asks(it), pts = (it.points || []).length;
    b.innerHTML = `<img loading="lazy" src="${img(it)}" alt="">${pts ? `<b class="pts">${pts} part${pts === 1 ? '' : 's'}</b>` : ''}${n ? `<b class="asks" title="${esc(AI)} is asking you about ${n} part${n === 1 ? '' : 's'}">${n}</b>` : ''}<span>${esc(name(it))}</span>`;
    if (it.want) b.insertAdjacentHTML('beforeend', `<b class="odtag want">Want built</b>`);
    else if (it.status === 'inbox') b.insertAdjacentHTML('beforeend', `<b class="odtag">${esc(AI)} brought</b>`);
    const x = document.createElement('i'); x.className = 'rmx'; x.textContent = '✕'; x.title = 'Remove this design (set aside, not deleted)';
    x.onclick = async e => { e.stopPropagation(); const r = await api('/' + it.id, 'DELETE'); if (r.ok) { all = all.filter(y => y.id !== it.id); if (cur === it.id) cur = null; toast("Removed. It's set aside in the folder, not deleted"); load(true); } };
    b.append(x);
    b.onclick = () => open(it.id); s.append(b);
  }
  s.scrollTop = y;
}

function open(id, point) {
  saveNote(); cur = id; mode = null; draft = fixing = editing = null; active = point || null; moreOpen = false;
  try { localStorage.setItem('taste-open', id); } catch {}
  drawTop(); drawStrip(); drawStage();
  document.querySelector('.th.on')?.scrollIntoView({ block: 'nearest' });
}

// ---- the stage ----
let picRect = null;
function setMode(k) { saveNote(); mode = k; draft = fixing = editing = null; drawTop(); drawStrip(); drawStage(); }

// The line over the stage: which design this is (and, from the glass, the one question), or which kind the board shows.
function drawHead() {
  const h = $('head');
  if (mode) {
    const label = KINDS.find(x => x[0] === mode)?.[1] || mode, back = item();
    h.innerHTML = `<h2>${esc(label)}</h2><span class="meta">every ${esc(label.toLowerCase())} part you've shown ${esc(AI)}</span>${back ? `<button class="back" id="backTo">← Back to ${esc(name(back))}</button>` : ''}`;
    if (back) $('backTo').onclick = () => setMode(null);
    return;
  }
  const it = item(); if (!it) { h.innerHTML = ''; return; }
  const n = (it.points || []).length, url = it.from?.url;
  h.innerHTML = `<h2>${esc(name(it))}</h2>${it.ours ? `<span class="ours ${it.ours}">${it.ours === 'love' ? 'Ours · you loved it' : 'Ours · not this'}</span>` : ''}`
    + (it.ask ? '' : it.want ? `<span class="wantTag">You want this built${it.want.sent === false ? ' · not sent yet' : ''}</span><button class="link" id="notWant">It's a taste, not a build</button>` : `<span class="meta">${n ? `${n} part${n === 1 ? '' : 's'}` : 'no parts yet'}</span>`)
    + (url ? `<a class="meta" href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))} ↗</a>` : '')
    + (it.status === 'inbox' ? `<span class="meta" style="color:var(--odie)">${esc(AI)} brought this one</span>` : '')
    + (it.ask ? `<div class="once"><span title="You saved this from your screen. Is it a look you like, or something you want built?">From your screen: a look you like, or want it built?</span><button class="like" id="onceLike">♥ I like it</button><button class="build" id="onceBuild">Want built</button></div>` : '');
  const setWant = async want => { const r = await api('/' + it.id, 'PATCH', { want }); if (!r.ok) return toast("That didn't save, try again"); Object.assign(it, await r.json()); if (!want) { delete it.want; delete it.ask; }
    toast(want ? `Marked to build. It reaches ${AI} when you press Send` : 'Kept as a taste. Box the part you like.'); drawStrip(); drawHead(); drawTop(); drawFoot(); };
  if (it.ask) { $('onceLike').onclick = () => setWant(false); $('onceBuild').onclick = () => setWant(true); }
  if (it.want) $('notWant').onclick = () => setWant(false);
}

const corrections = p => (p.corrected || []).map(c => `<p class="c">${esc(AI)} first said: ${esc(c.mine)}<br>You: ${esc(c.theirs)}</p>`).join('');

// A kind, in place: every part of that kind they boxed or agreed with, big, both sets of words, and the way to its design.
function drawBoard() {
  const look = $('look'), label = KINDS.find(x => x[0] === mode)?.[1] || mode;
  const got = learned.filter(p => p.kind === mode);
  look.innerHTML = `<div class="board">${got.length ? `<div class="shelf">` + got.map(p => `<button class="part${p.dislike ? ' not' : ''}" data-item="${p.item}" data-point="${p.point}" title="Open this part on its design">
      <div class="crop" style="background-image:url(/api/taste/${p.item}/points/${p.point}/crop)"></div>
      <div class="w">${p.dislike ? `<p class="n">Not this</p>` : ''}${p.his ? `<p class="h">${esc(p.his)}</p>` : ''}${corrections(p)}${p.read ? `<p class="o">${esc(p.read)}</p>` : ''}<small>from ${esc(p.title || 'a design')}${p.agreed ? ' · you agreed' : ''} →</small></div></button>`).join('') + `</div>`
    : `<div class="none"><b>Nothing about ${esc(label.toLowerCase())} yet</b>Box the ${esc(label.toLowerCase())} on any design you like, and it lands here.</div>`}</div>`;
  look.querySelectorAll('.part').forEach(b => b.onclick = () => open(b.dataset.item, b.dataset.point));
  $('foot').innerHTML = '';
}

function drawStage() {
  const look = $('look'), it = item(); look.innerHTML = '';
  drawHead();
  if (mode) return drawBoard();
  if (!it) {
    look.innerHTML = `<div class="empty" id="emptyDrop"><div><b>Show ${esc(AI)} a design you like</b>A screenshot of any app or site whose look you like.<br>Copy it, click here, and paste.<span class="keys">Ctrl+V to paste</span><span class="or">or drop a picture anywhere on this page, or click to pick a file</span></div></div>`;
    $('emptyDrop').onclick = () => $('pick').click();
    $('foot').innerHTML = ''; return;
  }
  const im = new Image(); im.className = 'pic'; im.draggable = false; im.src = img(it);
  im.onload = () => { if (cur === it.id && !mode) { look.append(im); fit(im); drawParts(); } };
  drawFoot();
}

// The picture is as big as the stage allows, never more than twice its own size (a small snip stays sharp),
// with room left around it so balloons for parts near an edge sit outside it.
function fit(im) {
  const look = $('look');
  if (narrow()) { picRect = null; im.style.width = Math.min(im.naturalWidth * 2, look.clientWidth - 32) + 'px'; return; }
  const W = look.clientWidth, H = look.clientHeight, padX = 170, padY = 18;
  const k = Math.min((W - padX * 2) / im.naturalWidth, (H - padY * 2) / im.naturalHeight, 2);
  const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
  picRect = { x: Math.round((W - w) / 2), y: Math.round((H - h) / 2), w, h };
  Object.assign(im.style, { left: picRect.x + 'px', top: picRect.y + 'px', width: w + 'px', height: h + 'px' });
}

const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
const px = b => ({ x: picRect.x + b.x * picRect.w, y: picRect.y + b.y * picRect.h, w: b.w * picRect.w, h: b.h * picRect.h });

function drawParts() {
  const look = $('look'), it = item(); if (!it || mode) return;
  look.querySelectorAll('.box, .bal, svg.tails, .teach').forEach(n => n.remove());
  const pts = [...(it.points || [])];
  const list = narrow() || !picRect;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'tails');
  const placed = [], boxes = list ? [] : pts.map(p => px(p.box));
  if (draft && !list) boxes.push(px(draft.box));

  // A balloon goes where it covers the least, always fully inside the stage (never cut off at an edge).
  const place = (el, bx, color, body) => {
    look.append(el);
    if (list) return;
    const W = look.clientWidth, H = look.clientHeight, w = el.offsetWidth, h = Math.min(el.offsetHeight, H - 16), gap = 26;
    const cx = bx.x + bx.w / 2, cy = bx.y + bx.h / 2;
    const cands = [];
    for (const g of [gap, gap + 70, gap + 160]) cands.push(
      { x: cx - w / 2, y: bx.y - h - g }, { x: cx - w / 2, y: bx.y + bx.h + g },
      { x: bx.x - w - g, y: cy - h / 2 }, { x: bx.x + bx.w + g, y: cy - h / 2 },
      { x: bx.x, y: bx.y - h - g }, { x: bx.x + bx.w - w, y: bx.y + bx.h + g },
      { x: bx.x - w - g, y: bx.y }, { x: bx.x + bx.w + g, y: bx.y },
      { x: bx.x - w - g, y: bx.y + bx.h - h }, { x: bx.x + bx.w + g, y: bx.y + bx.h - h });
    // On a small screen every spot near the part can be taken, so the stage's edges are spots too.
    for (let y = 8; y < H - h; y += 48) cands.push({ x: 8, y }, { x: W - w - 8, y });
    let best = null;
    for (const c of cands) {
      const r = { x: Math.max(8, Math.min(W - w - 8, c.x)), y: Math.max(8, Math.min(H - h - 8, c.y)), w, h };
      let cost = Math.abs(r.x - c.x) + Math.abs(r.y - c.y);                        // pushed off its spot by an edge
      cost += overlap(r, picRect) * 0.008;                                         // covering the picture
      cost += overlap(r, bx) * 2;                                                  // covering its own part
      for (const o of boxes) if (o !== bx) cost += overlap(r, o) * 0.05;           // covering another part
      for (const o of placed) cost += overlap(r, { x: o.x - 10, y: o.y - 10, w: o.w + 20, h: o.h + 20 }) * 6;   // on another balloon: the worst, it hides words and buttons
      cost += Math.hypot(r.x + w / 2 - cx, r.y + h / 2 - cy) * 1;                   // far from its part
      // its tail would run under another balloon: the person couldn't tell what's tied to what
      for (const o of placed) for (let t = 0.15; t < 1; t += 0.15) { const qx = r.x + w / 2 + (cx - r.x - w / 2) * t, qy = r.y + h / 2 + (cy - r.y - h / 2) * t; if (qx > o.x && qx < o.x + o.w && qy > o.y && qy < o.y + o.h) cost += 4000; }
      // or it would sit on an earlier balloon's tail
      for (const o of placed) for (let t = 0.15; t < 1; t += 0.15) { const qx = o.x + o.w / 2 + (o.tx - o.x - o.w / 2) * t, qy = o.y + o.h / 2 + (o.ty - o.y - o.h / 2) * t; if (qx > r.x && qx < r.x + w && qy > r.y && qy < r.y + h) cost += 4000; }
      if (!best || cost < best.cost) best = { ...r, cost, tx: cx, ty: cy };
    }
    placed.push(best); el.style.left = best.x + 'px'; el.style.top = best.y + 'px';
    // the tail: from the balloon's nearest edge to the nearest point of the part
    const bcx = best.x + w / 2, bcy = best.y + h / 2;
    const tip = { x: Math.min(bx.x + bx.w, Math.max(bx.x, bcx)), y: Math.min(bx.y + bx.h, Math.max(bx.y, bcy)) };
    const dx = tip.x - bcx, dy = tip.y - bcy; let a, b;
    if (Math.abs(dy) * w > Math.abs(dx) * h) { const y = dy < 0 ? best.y + 4 : best.y + h - 4, x = Math.min(best.x + w - 34, Math.max(best.x + 34, tip.x)); a = { x: x - 15, y }; b = { x: x + 15, y }; }
    else { const x = dx < 0 ? best.x + 4 : best.x + w - 4, y = Math.min(best.y + h - 30, Math.max(best.y + 30, tip.y)); a = { x, y: y - 15 }; b = { x, y: y + 15 }; }
    if (Math.hypot(tip.x - (a.x + b.x) / 2, tip.y - (a.y + b.y) / 2) < 8) return;
    // Far from its part, a wide wedge would cut across the picture: a short tail, then a thin line to a dot on the part.
    const far = Math.hypot(tip.x - (a.x + b.x) / 2, tip.y - (a.y + b.y) / 2);
    if (far > 110) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, k = 22 / far, sx = mx + (tip.x - mx) * k, sy = my + (tip.y - my) * k;
      const stub = document.createElementNS(svg.namespaceURI, 'polygon'); stub.setAttribute('points', `${a.x},${a.y} ${sx},${sy} ${b.x},${b.y}`); stub.setAttribute('fill', body); stub.setAttribute('stroke', color); stub.setAttribute('stroke-width', 3); stub.setAttribute('stroke-linejoin', 'round');
      const line = document.createElementNS(svg.namespaceURI, 'line'); Object.entries({ x1: sx, y1: sy, x2: tip.x, y2: tip.y, stroke: color, 'stroke-width': 2, 'stroke-opacity': .8 }).forEach(([k2, v2]) => line.setAttribute(k2, v2));
      const dot = document.createElementNS(svg.namespaceURI, 'circle'); Object.entries({ cx: tip.x, cy: tip.y, r: 5, fill: color }).forEach(([k2, v2]) => dot.setAttribute(k2, v2));
      svg.append(line, stub, dot); return;
    }
    const fill = document.createElementNS(svg.namespaceURI, 'polygon'); fill.setAttribute('points', `${a.x},${a.y} ${tip.x},${tip.y} ${b.x},${b.y}`); fill.setAttribute('fill', body);
    const edge = document.createElementNS(svg.namespaceURI, 'polyline'); edge.setAttribute('points', `${a.x},${a.y} ${tip.x},${tip.y} ${b.x},${b.y}`);
    edge.setAttribute('fill', 'none'); edge.setAttribute('stroke', color); edge.setAttribute('stroke-width', 3); edge.setAttribute('stroke-linejoin', 'round');
    svg.append(fill, edge);
  };

  const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  // A small screen can't hold every balloon whole: what they already agreed to shows as two lines, and opens whole on a click.
  const tight = !list && (look.clientWidth < 1400 || look.clientHeight < 760);
  const waitsOnThem = p => p.read && !p.verdict ? 0 : 1;
  pts.sort((a, b) => waitsOnThem(a) - waitsOnThem(b));
  pts.forEach(p => {
    const agreed = p.verdict?.ok === true, aiFirst = isAI(p);
    const color = p.dislike ? v('--no') : agreed ? v('--ok') : aiFirst ? v('--odie') : v('--him'), body = p.dislike ? v('--no-body') : aiFirst ? v('--odie-body') : v('--him-body');
    if (!list) {
      const bx = px(p.box), d = document.createElement('div');
      d.className = 'box' + (aiFirst ? ' ai' : '') + (p.dislike ? ' no' : '') + (active && active !== p.id ? ' dim' : '');
      Object.assign(d.style, { left: bx.x + 'px', top: bx.y + 'px', width: bx.w + 'px', height: bx.h + 'px', borderColor: color });
      d.onclick = e => { e.stopPropagation(); active = active === p.id ? null : p.id; drawParts(); };
      look.append(d);
    }
    const fresh = p.read && seen && !seen.has(p.id + p.read.at); if (p.read && seen) seen.add(p.id + p.read.at);
    const el = document.createElement('div'); el.className = 'bal' + (aiFirst ? ' ai' : '') + (p.dislike ? ' no' : '') + (agreed ? ' ok' : '') + (fresh ? ' new' : '') + (p.id === active && p.read && !p.verdict ? ' ask-on' : '') + (p.read && !p.verdict ? ' waits' : '') + (tight && agreed && active !== p.id ? ' compact' : ''); el.dataset.p = p.id;
    el.innerHTML = balloon(p);
    wire(el, p);
    if (el.classList.contains('compact')) { el.title = 'Open it whole'; el.addEventListener('click', e => { if (e.target.closest('button,textarea')) return; e.stopPropagation(); active = p.id; drawParts(); }); }
    place(el, list ? null : px(p.box), color, body);
  });

  if (draft && !list) {
    const bx = px(draft.box), d = document.createElement('div'); d.className = 'box' + (draft.dislike ? ' no' : '');
    Object.assign(d.style, { left: bx.x + 'px', top: bx.y + 'px', width: bx.w + 'px', height: bx.h + 'px' }); look.append(d);
    const el = document.createElement('div'); el.className = 'bal' + (draft.dislike ? ' no' : '');
    el.innerHTML = `<div class="who">${meIcon()}You</div><div class="lk"><button data-lk="like" class="${draft.dislike ? '' : 'on'}">♥ I like this</button><button data-lk="not" class="not${draft.dislike ? ' on' : ''}">✗ Not this</button></div><textarea id="draftWords" placeholder="${draft.dislike ? "What's off about it? A few words, or none." : 'What do you like here? A few words, or none.'}"></textarea><div class="hint">Enter saves it · Esc takes the box back</div>`;
    place(el, bx, draft.dislike ? v('--no') : v('--him'), draft.dislike ? v('--no-body') : v('--him-body'));
    el.onmousedown = e => e.stopPropagation();
    el.querySelectorAll('[data-lk]').forEach(b => b.onclick = e => { e.stopPropagation(); draft.dislike = b.dataset.lk === 'not'; drawParts(); });
    const t = el.querySelector('textarea'); t.value = draft.words || ''; t.focus();
    t.oninput = () => draft.words = t.value;
    t.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); savePoint(); } else if (e.key === 'Escape') { draft = null; drawParts(); } };
  }
  look.append(svg);
  const box = look.querySelector("[data-fix], [data-edit]"); if (box && document.activeElement !== box) { box.focus(); box.selectionStart = box.selectionEnd = box.value.length; }
  if (!list && !pts.length && !draft && !it.ask && !it.want) { const t = document.createElement('div'); t.className = 'teach'; t.textContent = `Drag a box around any part you like. That is how you show ${AI} what you mean.`; look.append(t); }
}

function balloon(p) {
  const agreed = p.verdict?.ok === true, notQuite = p.verdict?.ok === false;
  const unsentV = p.verdict && p.verdict.sent === false;
  const myRead = () => {
    let s = `<p>${esc(p.read.text)}</p>`;
    if (!p.verdict && fixing !== p.id) s += `<div class="acts"><button class="yes" data-do="yes">Yes, that's it</button><button class="nq" data-do="nq">Not quite</button></div>`;
    if (fixing === p.id) s += `<textarea data-fix placeholder="What is it, then? Your words."></textarea><div class="hint">Enter saves it · Esc goes back</div>`;
    if (notQuite) s += `<div class="said">You: ${esc(p.verdict.words || 'Not quite.')}</div>`;
    if (unsentV) s += `<div class="draft">Not sent yet · ➤ Send when you're ready<button class="undo" data-do="undo">undo</button></div>`;
    else if (notQuite) s += `<div class="hint">Sent. ${esc(AI)} is looking again.</div>`;
    return s;
  };
  if (isAI(p)) {
    const tag = agreed ? `<span class="tag ok">you agreed ✓</span>` : notQuite ? `<span class="tag">looking again</span>` : `<span class="tag">${esc(AI)}'s guess</span>`;
    return `<div class="who">${FACE}${esc(AI)}${tag}<button class="x" data-do="del" title="take this part off">✕</button></div>${myRead()}`;
  }
  const his = editing === p.id ? `<textarea data-edit></textarea><div class="hint">Enter saves · Esc goes back</div>`
    : p.his ? `<p data-do="edit" title="click to change your words">${esc(p.his)}</p>` : `<p class="quiet" data-do="edit">This part. (no words, click to add some)</p>`;
  let s = `<div class="who">${meIcon()}You${p.dislike ? `<span class="tag" style="color:var(--no)">not this</span>` : ''}<button class="x" data-do="del" title="take this part off">✕</button></div>${his}`;
  if (p.read) s += `<div class="mine"><div class="who">${FACE}${esc(AI)}${agreed ? `<span class="tag ok">you agreed ✓</span>` : ''}</div>${myRead()}</div>`;
  else if (p.sent === false) s += `<div class="draft">Not sent yet · ➤ Send when you're ready</div>`;
  else s += `<div class="hint">Sent. ${esc(AI)} is looking.</div>`;
  return s;
}

function wire(el, p) {
  const it = item(), path = `/${it.id}/points/${p.id}`;
  const patch = async body => { const r = await api(path, 'PATCH', body); if (r.ok) { const n = await r.json(); for (const k of Object.keys(p)) if (!(k in n) && k !== 'crop') delete p[k]; Object.assign(p, n); } else toast("That didn't save, try again"); };
  el.onclick = e => e.stopPropagation();
  el.onmousedown = e => e.stopPropagation();
  el.querySelectorAll('[data-do]').forEach(b => b.onclick = async e => {
    e.stopPropagation(); const what = b.dataset.do;
    if (what === 'yes') { await patch({ verdict: { ok: true } }); refresh(); drawFoot(); toast(`Saved. It reaches ${AI} when you press Send`); }
    else if (what === 'nq') { fixing = p.id; drawParts(); }
    else if (what === 'undo') { await patch({ verdict: null }); refresh(); drawFoot(); }
    else if (what === 'edit') { editing = p.id; drawParts(); }
    else if (what === 'del') { const r = await api(path, 'DELETE'); if (r.ok) { it.points = it.points.filter(x => x.id !== p.id); refresh(); drawFoot(); toast('That part is off'); } }
  });
  const fx = el.querySelector('[data-fix]');
  if (fx) { fx.value = typed["f" + p.id] || ""; fx.oninput = () => typed["f" + p.id] = fx.value; fx.onkeydown = async e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fixing = null; delete typed["f" + p.id]; await patch({ verdict: { ok: false, words: fx.value } }); refresh(); drawFoot(); toast(`Saved. It reaches ${AI} when you press Send`); }
    else if (e.key === 'Escape') { fixing = null; drawParts(); } }; }
  const ed = el.querySelector('[data-edit]');
  if (ed) { ed.value = typed["e" + p.id] ?? (p.his || ""); ed.oninput = () => typed["e" + p.id] = ed.value; ed.onkeydown = async e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editing = null; delete typed["e" + p.id]; await patch({ his: ed.value }); refresh(); }
    else if (e.key === 'Escape') { editing = null; drawParts(); } }; }
}
function refresh() { drawStrip(); drawHead(); drawParts(); drawTop(); fetch('/api/taste/learned').then(r => r.json()).then(l => { learned = l.learned || []; drawTop(); }); }

// Every part needs its crop (the AI reads it, the boards show it). The page cuts any that are missing: nothing to install.
const cutting = new Set();   // by part and box, so a moved box gets a new crop
const ck = p => p.id + JSON.stringify(p.box);
async function crops() {
  for (const it of all) {
    const need = (it.points || []).filter(p => !p.crop && !cutting.has(ck(p)));
    if (!need.length) continue;
    need.forEach(p => cutting.add(ck(p)));
    const im = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = img(it); });
    if (!im) continue;
    for (const p of need) {
      const pad = 0.012, x0 = Math.max(0, p.box.x - pad), y0 = Math.max(0, p.box.y - pad), x1 = Math.min(1, p.box.x + p.box.w + pad), y1 = Math.min(1, p.box.y + p.box.h + pad);
      const W = im.naturalWidth, H = im.naturalHeight, c = document.createElement('canvas');
      const sx = Math.round(x0 * W), sy = Math.round(y0 * H); c.width = Math.max(8, Math.round((x1 - x0) * W)); c.height = Math.max(8, Math.round((y1 - y0) * H));
      c.getContext('2d').drawImage(im, sx, sy, c.width, c.height, 0, 0, c.width, c.height);
      const r = await api(`/${it.id}/points/${p.id}/crop`, 'PUT', { image: c.toDataURL('image/png') }).catch(() => null);
      if (r?.ok) p.crop = true; else cutting.delete(ck(p));
    }
  }
}

async function savePoint() {
  const it = item(), d = draft; if (!it || !d) return;
  draft = null;
  const r = await api(`/${it.id}/points`, 'POST', { box: d.box, his: d.words || '', dislike: !!d.dislike });
  if (!r.ok) { draft = d; toast("That didn't save. Your words are still here, press Enter again."); drawParts(); return; }
  (it.points ||= []).push(await r.json());
  if (it.status === 'inbox') it.status = 'kept';
  refresh(); drawFoot(); crops();
}

// Drawing a box on the picture: press, drag, let go, say what you like.
let drag = null;
$('look').addEventListener('mousedown', e => {
  if (!picRect || !e.target.classList.contains('pic')) return;
  if (draft) { if ((draft.words || '').trim()) return savePoint(); draft = null; }
  const r = $('look').getBoundingClientRect(); e.preventDefault();
  drag = { x0: e.clientX - r.left, y0: e.clientY - r.top, el: Object.assign(document.createElement('div'), { className: 'box draw' }) };
  $('look').append(drag.el); $('look').classList.add('drawing');
});
addEventListener('mousemove', e => {
  if (!drag) return; const r = $('look').getBoundingClientRect();
  const cl = (v, a, b) => Math.min(b, Math.max(a, v));
  const x1 = cl(e.clientX - r.left, picRect.x, picRect.x + picRect.w), y1 = cl(e.clientY - r.top, picRect.y, picRect.y + picRect.h);
  drag.r = { x: Math.min(drag.x0, x1), y: Math.min(drag.y0, y1), w: Math.abs(x1 - drag.x0), h: Math.abs(y1 - drag.y0) };
  Object.assign(drag.el.style, { left: drag.r.x + 'px', top: drag.r.y + 'px', width: drag.r.w + 'px', height: drag.r.h + 'px' });
});
addEventListener('mouseup', () => {
  if (!drag) return; const d = drag; drag = null; d.el.remove(); $('look').classList.remove('drawing');
  if (!d.r || d.r.w < 14 || d.r.h < 14) { if (active) { active = null; drawParts(); } return; }
  active = null; fixing = editing = null;
  draft = { box: { x: (d.r.x - picRect.x) / picRect.w, y: (d.r.y - picRect.y) / picRect.h, w: d.r.w / picRect.w, h: d.r.h / picRect.h }, words: '' };
  drawParts();
});

// ---- under the picture ----
let noteTimer = null;
function drawFoot() {
  const f = $('foot'), it = item(); if (!it || mode) return;
  const used = (it.used || []).map(u => `<span class="used">Used in ${esc(u.what)}, ${new Date(u.at).toLocaleDateString([], { month: 'short', day: 'numeric' })}</span>`).join('');
  // The slim line: their words on the whole design, and a summary of what the AI took from it that opens over the picture on a click.
  // It's the same height on every design, so the picture never changes size and nothing reshuffles.
  const mineL = learned.filter(p => p.item === it.id);
  const firstLesson = mineL.map(p => p.read || p.his).find(Boolean);
  const sum = it.want ? `You want this built. ${AI} will make it with you.` : mineL.length ? `${mineL.length} part${mineL.length === 1 ? '' : 's'}: ${firstLesson || ''}` : 'Nothing yet. Box a part you like and say why.';
  f.innerHTML = `<div class="say him">${meIcon()}<div class="body"><span class="lab">You, on the whole thing</span><input id="note" placeholder="${it.want ? 'What should it do? A few words.' : 'Anything about it as a whole. Or just box the parts.'}"></div></div>
    <button class="say ai sum${moreOpen ? ' open' : ''}" id="sum">${FACE}<div class="body"><span class="lab">What ${esc(AI)} learned from this design</span><p>${esc(sum)}</p></div><span class="chev">${moreOpen ? '▾ Close' : '▸ Open'}</span></button>
    ${moreOpen ? `<div class="more" id="more"><h3>What ${esc(AI)} learned from ${esc(name(it))}</h3>${it.take ? `<p class="take">${esc(it.take)}</p>` : ''}${mineL.map(p => `<div class="lp${p.dislike ? ' not' : ''}"><div class="crop" style="background-image:url(/api/taste/${it.id}/points/${p.point}/crop)"></div><div>${p.dislike ? '<b class="n">Not this</b>' : ''}${p.his ? `<p class="h">${esc(p.his)}</p>` : ''}${corrections(p)}${p.read ? `<p class="o">${esc(p.read)}</p>` : ''}</div></div>`).join('') || '<p class="quiet">No parts yet. Box what you like, press Send, and it shows up here.</p>'}${used ? `<div>${used}</div>` : ''}</div>` : ''}`;
  $('sum').onclick = () => { moreOpen = !moreOpen; drawFoot(); };
  const n = $('note'); n.value = it.note || '';
  n.oninput = () => { clearTimeout(noteTimer); noteTimer = setTimeout(saveNote, 700); };
  n.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); n.blur(); toast('Saved ✓'); } };
  n.onblur = saveNote;
}
async function saveNote() {
  clearTimeout(noteTimer); const n = $('note'), it = item(); if (!n || !it) return;
  const v = n.value.trim(); if (v === (it.note || '')) return;
  const r = await api('/' + it.id, 'PATCH', { note: v }); if (r.ok) it.note = v; else toast("Your line didn't save, try again");
}

$('send').onclick = async () => {
  if (!unsent()) return toast('Nothing to send yet. Box a part, or answer a question, first.');
  const r = await api('/send', 'POST', {}); if (!r.ok) return toast("That didn't send, try again");
  const { sent } = await r.json(); toast(sent ? `Sent ${sent} to ${AI} ✓` : 'Nothing to send'); load();
};

// ---- saving their own: paste, drop, or pick ----
const asDataUrl = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const size = src => new Promise(ok => { const i = new Image(); i.onload = () => ok([i.naturalWidth, i.naturalHeight]); i.onerror = () => ok([null, null]); i.src = src; });
async function saveFiles(files) {
  const pics = [...files].filter(f => f.type.startsWith('image/'));
  if (!pics.length) return toast("That wasn't a picture");
  let last = null;
  for (const f of pics) {
    const data = await asDataUrl(f), [w, h] = await size(data);
    const r = await api('', 'POST', { image: data, from: { how: 'paste', w, h } });
    if (!r.ok) { toast("Couldn't save that one"); continue; }
    last = await r.json(); all.unshift(last);
  }
  if (last) { open(last.id); toast('Saved ✓ Now box the part you like.'); }
}
$('pick').onchange = e => { saveFiles(e.target.files); e.target.value = ''; };
document.addEventListener('paste', e => { const files = e.clipboardData?.files; if (files && files.length) { e.preventDefault(); saveFiles(files); } });
let dragDepth = 0;
document.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); if (e.dataTransfer.files.length) saveFiles(e.dataTransfer.files); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && moreOpen) { moreOpen = false; return drawFoot(); }
  if (e.key === 'Escape' && mode) return setMode(null);
  if (mode && /^arrow/i.test(e.key)) return;
  const k = e.key.toLowerCase(), order = [...mine(), ...brought()], i = order.findIndex(x => x.id === cur);
  if (k === 'arrowdown' || k === 'arrowright') { e.preventDefault(); if (order[i + 1]) open(order[i + 1].id); }
  else if (k === 'arrowup' || k === 'arrowleft') { e.preventDefault(); if (order[i - 1]) open(order[i - 1].id); }
  else if (k === 'escape' && active) { active = null; drawParts(); }
  else if (e.altKey && k === 'q' && unsent()) { e.preventDefault(); $('send').click(); }
});
// The picture refits only when its space really changes size (a window resize), never on a plain refresh.
let rz = null, lastLook = '';
new ResizeObserver(() => { const l = $('look'), k = l.clientWidth + 'x' + l.clientHeight; if (k === lastLook) return; lastLook = k;
  clearTimeout(rz); rz = setTimeout(() => { const im = document.querySelector('.pic'); if (im && !mode) { fit(im); drawParts(); } }, 120); }).observe($('look'));

// New things show up by themselves: the AI's reads, a picture saved from the glass.
// After the server restarts (a new name or picture in the config), the stream reconnects: read who we are again.
try { const ev = new EventSource('/api/events'); let opened = false; ev.addEventListener('taste', () => load()); ev.onopen = () => { if (opened) who().then(() => load(true)); opened = true; }; } catch {}
setInterval(() => { if (!document.hidden) load(); }, 20000);
// When this page's file changes (an update, a git pull), an open window picks it up by itself, unless they're mid-typing.
let myVersion = null;
setInterval(async () => { try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }); const v = r.headers.get('last-modified'); if (myVersion === null) myVersion = v; else if (v && v !== myVersion && !typing()) location.reload(); } catch {} }, 4000);
who().then(() => load(true));
</script>
</body>
</html>
